<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>ClearDoc — Document Result</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-dim": "#dadad9", "on-primary-fixed": "#00201c", "error": "#ba1a1a",
            "inverse-on-surface": "#f1f0f0", "on-error": "#ffffff", "on-secondary-container": "#576378",
            "surface-bright": "#faf9f8", "inverse-primary": "#3cddc7", "secondary-fixed": "#d7e3fc",
            "on-surface-variant": "#3c4a46", "surface-container-highest": "#e3e2e1", "on-surface": "#1a1c1c",
            "primary-fixed-dim": "#3cddc7", "on-tertiary-container": "#744000", "tertiary-fixed": "#ffdcc0",
            "secondary-container": "#d4e0f9", "on-tertiary-fixed-variant": "#6b3b00", "secondary": "#535f74",
            "on-secondary-fixed-variant": "#3c475b", "inverse-surface": "#2f3130", "tertiary": "#8d4f00",
            "surface-tint": "#006b5f", "surface-container-low": "#f4f3f2", "secondary-fixed-dim": "#bbc7df",
            "on-primary-fixed-variant": "#005047", "primary": "#006b5f", "tertiary-fixed-dim": "#ffb875",
            "on-tertiary-fixed": "#2d1600", "primary-fixed": "#62fae3", "surface-container-high": "#e9e8e7",
            "outline-variant": "#bacac5", "on-background": "#1a1c1c", "outline": "#6b7a76",
            "primary-container": "#2dd4bf", "on-secondary-fixed": "#101c2e", "on-tertiary": "#ffffff",
            "on-error-container": "#93000a", "on-secondary": "#ffffff", "on-primary-container": "#00574d",
            "surface": "#faf9f8", "error-container": "#ffdad6", "background": "#faf9f8",
            "surface-variant": "#e3e2e1", "tertiary-container": "#ffac5a", "surface-container": "#eeeeed",
            "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "navy-brand": "#0F1B2D"
          },
          "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
          "spacing": { "unit": "8px", "stack-md": "16px", "margin-mobile": "16px", "stack-sm": "8px", "stack-lg": "32px", "gutter": "24px", "container-max-width": "1200px", "margin-desktop": "40px" },
          "fontFamily": { "body-lg": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "headline-lg-mobile": ["Inter"] },
          "fontSize": {
            "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
            "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
            "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
            "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }]
          }
        }
      }
    }
  </script>
  <style>
    @layer base { body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeInUp 0.35s ease-out forwards; }
    .fade-in-d1 { animation-delay: 0.05s; opacity: 0; }
    .fade-in-d2 { animation-delay: 0.1s; opacity: 0; }
    .fade-in-d3 { animation-delay: 0.15s; opacity: 0; }
  </style>
</head>
<body class="bg-background font-body-md text-on-surface">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-navy-brand pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.1)]">
    <div class="h-16 px-margin-mobile flex items-center justify-between">
      <div class="flex items-center gap-unit">
        <button class="w-10 h-10 -ml-2 flex items-center justify-center text-on-primary/80" onclick="goBack()">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <span class="font-headline-sm text-on-primary" id="headerTitle">Document Result</span>
      </div>
      <button onclick="deleteDoc()" class="w-10 h-10 flex items-center justify-center text-on-primary/60 hover:text-red-400 rounded-lg transition-colors">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </div>
  </header>

  <main class="relative w-full pt-16 min-h-screen">
    <div class="flex flex-col w-full pb-[100px] bg-background min-h-[calc(100vh-64px)] relative">

      <!-- Loading -->
      <div id="loadingState" class="flex flex-col items-center justify-center py-20">
        <div class="w-10 h-10 border-[3px] border-primary-container/30 border-t-primary-container rounded-full" style="animation: spin 0.8s linear infinite"></div>
        <p class="font-body-sm text-on-surface-variant mt-3">Loading document...</p>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

      <!-- Content (hidden until loaded) -->
      <div id="contentArea" class="hidden px-margin-mobile flex flex-col gap-stack-lg max-w-container-max-width mx-auto w-full">

        <!-- Deadline Banner -->
        <div id="deadlineBanner" class="bg-error-container text-on-error-container px-margin-mobile py-4 flex items-start gap-3 shadow-sm rounded-xl fade-in">
          <span class="material-symbols-outlined shrink-0 mt-0.5 text-error">warning</span>
          <p class="font-body-md font-medium" id="deadlineText"></p>
        </div>

        <!-- What This Means -->
        <section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_12px_rgba(15,27,45,0.05)] relative overflow-hidden group fade-in fade-in-d1">
          <div class="absolute top-0 left-0 w-1 h-full bg-primary-container"></div>
          <div class="flex items-center gap-2 mb-3">
            <span class="material-symbols-outlined text-primary">lightbulb</span>
            <h2 class="font-headline-sm text-on-surface">What this means</h2>
          </div>
          <p class="font-body-lg text-on-surface-variant leading-relaxed" id="meaningText"></p>
        </section>

        <!-- Key Points -->
        <section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_12px_rgba(15,27,45,0.05)] fade-in fade-in-d2">
          <div class="flex items-center gap-2 mb-4">
            <span class="material-symbols-outlined text-secondary">fact_check</span>
            <h2 class="font-headline-sm text-on-surface">Key Points</h2>
          </div>
          <ul class="flex flex-col" id="keyPointsList"></ul>
        </section>

        <!-- What You Should Do -->
        <section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_12px_rgba(15,27,45,0.05)] fade-in fade-in-d3">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-primary">task_alt</span>
              <h2 class="font-headline-sm text-on-surface">What you should do</h2>
            </div>
            <span class="text-xs font-medium text-on-surface-variant bg-surface-container px-2 py-1 rounded-md" id="stepsCount"></span>
          </div>
          <div class="flex flex-col gap-3" id="checklist"></div>
        </section>

      </div>
    </div>
  </main>

  <!-- Fixed Bottom Bar -->
  <div id="bottomBar" class="hidden fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md px-margin-mobile py-4 shadow-[0_-4px_16px_rgba(0,0,0,0.05)] pb-safe z-40">
    <div class="max-w-container-max-width mx-auto flex gap-3">
      <button onclick="goBack()" class="flex-1 h-12 flex items-center justify-center rounded-lg border-2 border-on-surface text-on-surface font-label-md transition-colors active:bg-surface-container">
        Back to History
      </button>
      <button onclick="explainAnother()" class="flex-1 h-12 flex items-center justify-center rounded-lg bg-primary-container text-on-surface font-label-md transition-transform active:scale-[0.98] shadow-sm">
        Explain Another
      </button>
    </div>
  </div>

  <script>
    // ── State ────────────────────────────────────────────────
    let currentDocId = null;
    let currentUser = null;

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    // ── Init ─────────────────────────────────────────────────
    function init() {
      const raw = localStorage.getItem("cleardoc_user");
      if (!raw) { window.location.href = "/"; return; }
      currentUser = JSON.parse(raw);

      const params = new URLSearchParams(window.location.search);
      currentDocId = params.get("id");
      if (!currentDocId) { goBack(); return; }

      loadDocument();
    }

    // ── Load Document ────────────────────────────────────────
    async function loadDocument() {
      try {
        const res = await fetch(`/api/document/${currentDocId}`);
        if (!res.ok) throw new Error("Not found");
        const data = await res.json();
        renderResult(data);
      } catch (err) {
        document.getElementById("loadingState").innerHTML =
          '<div class="text-center py-20"><span class="material-symbols-outlined text-4xl text-on-surface-variant/40 mb-3 block">error_outline</span><p class="font-body-sm text-on-surface-variant">Document not found.</p><button onclick="goBack()" class="mt-4 px-4 py-2 rounded-lg bg-primary-container text-on-primary-container font-label-md">Go Back</button></div>';
      }
    }

    // ── Render Screen 3 (identical to Screen 2) ──────────────
    function renderResult(data) {
      document.getElementById("loadingState").classList.add("hidden");
      document.getElementById("contentArea").classList.remove("hidden");
      document.getElementById("bottomBar").classList.remove("hidden");

      // Header title
      const typeLabel = (data.doc_type || "document").replace(/_/g, " ");
      document.getElementById("headerTitle").textContent = typeLabel.charAt(0).toUpperCase() + typeLabel.slice(1);

      // Deadline banner
      if (data.urgency_flag && data.urgency_message) {
        document.getElementById("deadlineBanner").classList.remove("hidden");
        document.getElementById("deadlineText").textContent = data.urgency_message;
      } else if (data.deadline) {
        document.getElementById("deadlineBanner").classList.remove("hidden");
        document.getElementById("deadlineText").textContent = `Action required by ${data.deadline} — don't miss this deadline.`;
      } else {
        document.getElementById("deadlineBanner").classList.add("hidden");
      }

      // What this means
      document.getElementById("meaningText").textContent = data.meaning || "";

      // Key Points
      const kpList = document.getElementById("keyPointsList");
      kpList.innerHTML = (data.key_points || []).map(kp =>
        `<li class="flex items-start gap-3 py-3 border-b border-surface-container-high last:border-0 last:pb-0">
          <div class="w-2 h-2 rounded-full bg-primary-container mt-2 shrink-0"></div>
          <div>
            <span class="font-label-md text-on-surface-variant block mb-1 uppercase tracking-wider text-xs">${esc(kp.label)}</span>
            <span class="font-body-md text-on-surface">${esc(kp.value)}</span>
          </div>
        </li>`
      ).join("");

      // Steps checklist
      const steps = data.steps || [];
      document.getElementById("stepsCount").textContent = steps.length + " Steps";
      document.getElementById("checklist").innerHTML = steps.map(step =>
        `<label class="flex items-start gap-4 p-4 rounded-lg bg-surface hover:bg-surface-container-low transition-colors cursor-pointer group">
          <div class="relative flex items-center justify-center w-6 h-6 mt-0.5 rounded border-2 border-outline-variant group-hover:border-primary transition-all">
            <input class="absolute opacity-0 w-full h-full cursor-pointer" onchange="toggleCheck(this)" type="checkbox"/>
            <span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 transition-opacity">check</span>
          </div>
          <div class="flex-1">
            <span class="font-label-md text-on-surface block mb-1">${esc(step.title)}</span>
            <span class="font-body-sm text-on-surface-variant block">${esc(step.description)}</span>
          </div>
        </label>`
      ).join("");
    }

    // ── Checklist Toggle + Particle Burst ────────────────────
    function toggleCheck(checkbox) {
      const icon = checkbox.nextElementSibling;
      const textContainer = checkbox.closest("label").querySelector(".flex-1");
      const title = textContainer.querySelector(".font-label-md");
      const desc = textContainer.querySelector(".font-body-sm");

      if (checkbox.checked) {
        icon.classList.remove("opacity-0");
        icon.parentElement.classList.add("bg-primary", "border-primary");
        icon.parentElement.classList.remove("border-outline-variant", "group-hover:border-primary");
        title.classList.add("line-through", "text-on-surface-variant");
        desc.classList.add("opacity-50");
        const rect = checkbox.parentElement.getBoundingClientRect();
        createBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      } else {
        icon.classList.add("opacity-0");
        icon.parentElement.classList.remove("bg-primary", "border-primary");
        icon.parentElement.classList.add("border-outline-variant", "group-hover:border-primary");
        title.classList.remove("line-through", "text-on-surface-variant");
        desc.classList.remove("opacity-50");
      }
    }

    function createBurst(x, y) {
      for (let i = 0; i < 5; i++) {
        const particle = document.createElement("div");
        particle.className = "absolute w-2 h-2 bg-primary rounded-full pointer-events-none z-50";
        document.body.appendChild(particle);
        const angle = Math.random() * Math.PI * 2;
        const velocity = 2 + Math.random() * 2;
        const tx = Math.cos(angle) * velocity * 15;
        const ty = Math.sin(angle) * velocity * 15;
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.animate([
          { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
        ], {
          duration: 400 + Math.random() * 200,
          easing: "cubic-bezier(0, .9, .57, 1)"
        }).onfinish = () => particle.remove();
      }
    }

    // ── Navigation ───────────────────────────────────────────
    function goBack() {
      window.location.href = "/app.html#history";
    }

    function explainAnother() {
      window.location.href = "/app.html";
    }

    async function deleteDoc() {
      if (!confirm("Delete this document from your history?")) return;
      try {
        await fetch(`/api/document/${currentDocId}/${currentUser.device_id}`, { method: "DELETE" });
        window.location.href = "/app.html#history";
      } catch (err) {
        alert("Could not delete.");
      }
    }

    // ── Start ────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
