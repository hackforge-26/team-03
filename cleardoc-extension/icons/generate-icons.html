<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator - ClearDoc</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f0f0f0; }
    canvas { border: 1px solid #ccc; margin: 10px; }
    h1 { margin-bottom: 20px; }
    p { color: #666; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>ClearDoc Icon Generator</h1>
  <p>Open this page in a browser, right-click each canvas, and "Save image as" to create the required PNG icons.</p>
  
  <h3>16x16</h3>
  <canvas id="c16" width="16" height="16"></canvas>
  
  <h3>48x48</h3>
  <canvas id="c48" width="48" height="48"></canvas>
  
  <h3>128x128</h3>
  <canvas id="c128" width="128" height="128"></canvas>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#2563eb');
      grad.addColorStop(1, '#7c3aed');
      
      // Rounded rect
      const r = size * 0.18;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      
      // "C" letter
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.55}px -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('C', size / 2, size / 2);
    }
    
    drawIcon('c16', 16);
    drawIcon('c48', 48);
    drawIcon('c128', 128);
  </script>
</body>
</html>
