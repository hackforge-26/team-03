<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>ClearDoc — Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-dim": "#dadad9",
            "on-primary-fixed": "#00201c",
            "error": "#ba1a1a",
            "inverse-on-surface": "#f1f0f0",
            "on-error": "#ffffff",
            "on-secondary-container": "#576378",
            "surface-bright": "#faf9f8",
            "inverse-primary": "#3cddc7",
            "secondary-fixed": "#d7e3fc",
            "on-surface-variant": "#3c4a46",
            "surface-container-highest": "#e3e2e1",
            "on-surface": "#1a1c1c",
            "primary-fixed-dim": "#3cddc7",
            "on-tertiary-container": "#744000",
            "tertiary-fixed": "#ffdcc0",
            "secondary-container": "#d4e0f9",
            "on-tertiary-fixed-variant": "#6b3b00",
            "secondary": "#535f74",
            "on-secondary-fixed-variant": "#3c475b",
            "inverse-surface": "#2f3130",
            "tertiary": "#8d4f00",
            "surface-tint": "#006b5f",
            "surface-container-low": "#f4f3f2",
            "secondary-fixed-dim": "#bbc7df",
            "on-primary-fixed-variant": "#005047",
            "primary": "#006b5f",
            "tertiary-fixed-dim": "#ffb875",
            "on-tertiary-fixed": "#2d1600",
            "primary-fixed": "#62fae3",
            "surface-container-high": "#e9e8e7",
            "outline-variant": "#bacac5",
            "on-background": "#1a1c1c",
            "outline": "#6b7a76",
            "primary-container": "#2dd4bf",
            "on-secondary-fixed": "#101c2e",
            "on-tertiary": "#ffffff",
            "on-error-container": "#93000a",
            "on-secondary": "#ffffff",
            "on-primary-container": "#00574d",
            "surface": "#faf9f8",
            "error-container": "#ffdad6",
            "background": "#faf9f8",
            "surface-variant": "#e3e2e1",
            "tertiary-container": "#ffac5a",
            "surface-container": "#eeeeed",
            "on-primary": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "navy-brand": "#0F1B2D"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "unit": "8px",
            "stack-md": "16px",
            "margin-mobile": "16px",
            "stack-sm": "8px",
            "stack-lg": "32px",
            "gutter": "24px",
            "container-max-width": "1200px",
            "margin-desktop": "40px"
          },
          "fontFamily": {
            "body-lg": ["Inter"],
            "headline-lg": ["Inter"],
            "label-sm": ["Inter"],
            "body-md": ["Inter"],
            "headline-md": ["Inter"],
            "label-md": ["Inter"],
            "body-sm": ["Inter"],
            "headline-sm": ["Inter"],
            "headline-lg-mobile": ["Inter"]
          },
          "fontSize": {
            "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
            "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
            "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
            "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }]
          }
        }
      }
    }
  </script>
  <style>
    @layer base {
      body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease-out forwards;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-background font-body-md text-on-surface">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-navy-brand pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.1)]">
    <div class="h-16 px-margin-mobile flex items-center justify-between">
      <div class="flex items-center gap-unit">
        <button class="w-10 h-10 -ml-2 flex items-center justify-center text-on-primary/80" onclick="history.back()">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <span class="font-headline-sm text-on-primary">Sign Up</span>
      </div>
    </div>
  </header>

  <main class="relative w-full pt-16 min-h-screen">
    <div class="flex flex-col w-full h-full bg-navy-brand min-h-screen text-on-primary">

      <div class="flex flex-col flex-1 px-margin-mobile pb-margin-mobile pt-12 items-center justify-center max-w-sm mx-auto w-full">

        <!-- Logo -->
        <div class="w-32 h-32 mb-stack-lg rounded-xl overflow-hidden shadow-xl bg-surface-container-lowest animate-fade-in-up">
          <img alt="ClearDoc Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UTN_SbRVkpGlKdC8fyvVcsZAl5mqhSbnFTAueotqakNYyRmKwcDZhByUQgmd9ydkmVVt43TJWTQzEn6I-hSY-K1R3FC44rXGv7inKAUoUAqbPfArpYXTvXojghul4LD9HdWWAPawQPNscL4AxpWYnYrLxTw6iVFYEfA0NeEwbprIPJ1WgYyz5kR-AbYNyyILGcpZyvI1DH8MgDg9BznGZUTWOhWXX-wvIKOsWRdg6wcaakWpWNuenqag"/>
        </div>

        <!-- Header Text -->
        <div class="text-center mb-stack-lg w-full animate-fade-in-up" style="animation-delay: 0.1s">
          <h1 class="font-headline-lg-mobile text-on-primary mb-stack-sm tracking-tight">Create your account</h1>
          <p class="font-body-md text-on-primary/80">Start simplifying your documents today.</p>
        </div>

        <!-- Error Message -->
        <div id="errorMsg" class="hidden mb-4 w-full bg-red-500/20 border border-red-400/50 rounded-lg p-3 text-center">
          <p class="font-body-sm text-red-200" id="errorText"></p>
        </div>

        <!-- Form Card -->
        <div class="bg-surface-container-lowest rounded-2xl p-stack-lg w-full shadow-2xl relative animate-fade-in-up" style="animation-delay: 0.2s">
          <div class="absolute -top-3 -right-3 w-6 h-6 bg-primary-container rounded-full animate-ping opacity-75"></div>
          <div class="absolute -top-3 -right-3 w-6 h-6 bg-primary-container rounded-full opacity-90"></div>

          <form id="signupForm" class="flex flex-col gap-stack-md text-on-surface">
            <!-- Full Name Input -->
            <div class="flex flex-col gap-2">
              <label class="font-label-md text-on-surface-variant" for="fullName">Full Name</label>
              <div class="relative group">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors">person</span>
                <input class="w-full h-12 pl-10 pr-4 rounded-lg bg-surface-container-low font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" id="fullName" placeholder="Enter your name" required type="text"/>
              </div>
            </div>

            <!-- Gmail Input -->
            <div class="flex flex-col gap-2">
              <label class="font-label-md text-on-surface-variant" for="email">Gmail Address</label>
              <div class="relative group">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors">mail</span>
                <input class="w-full h-12 pl-10 pr-4 rounded-lg bg-surface-container-low font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" id="email" placeholder="yourname@gmail.com" required type="email"/>
              </div>
            </div>

            <!-- Submit Button -->
            <button id="submitBtn" class="mt-stack-sm w-full h-12 rounded-lg bg-primary-container text-on-primary-container font-label-md flex items-center justify-center gap-2 hover:bg-primary-fixed-dim transition-colors shadow-sm active:scale-[0.98]" type="submit">
              <span id="btnText">Proceed to Sign Up</span>
              <span id="btnArrow" class="material-symbols-outlined text-[20px]">arrow_forward</span>
              <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-on-primary-container" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            </button>
          </form>
        </div>

        <!-- Footer Terms -->
        <div class="mt-stack-lg text-center w-full max-w-[280px] animate-fade-in-up" style="animation-delay: 0.3s">
          <p class="font-body-sm text-on-primary/60 leading-relaxed">
            By signing up, you agree to our <a class="text-primary-container hover:underline underline-offset-2" href="#">Terms</a> and <a class="text-primary-container hover:underline underline-offset-2" href="#">Privacy Policy</a>.
          </p>
        </div>

      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("signupForm");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnArrow = document.getElementById("btnArrow");
    const btnSpinner = document.getElementById("btnSpinner");
    const errorMsg = document.getElementById("errorMsg");
    const errorText = document.getElementById("errorText");

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.classList.remove("hidden");
      form.classList.add("animate-shake");
      setTimeout(() => form.classList.remove("animate-shake"), 400);
    }

    function hideError() {
      errorMsg.classList.add("hidden");
    }

    function setLoading(loading) {
      if (loading) {
        submitBtn.disabled = true;
        btnText.textContent = "Creating account...";
        btnArrow.classList.add("hidden");
        btnSpinner.classList.remove("hidden");
        submitBtn.classList.add("opacity-70", "cursor-not-allowed");
      } else {
        submitBtn.disabled = false;
        btnText.textContent = "Proceed to Sign Up";
        btnArrow.classList.remove("hidden");
        btnSpinner.classList.add("hidden");
        submitBtn.classList.remove("opacity-70", "cursor-not-allowed");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      // If already signed up, just go to app
      const existing = localStorage.getItem("cleardoc_user");
      if (existing) {
        try {
          const user = JSON.parse(existing);
          if (user && user.device_id) {
            window.location.href = "/app.html";
            return;
          }
        } catch (err) {}
      }

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!fullName) {
        showError("Please enter your full name.");
        return;
      }

      if (!email) {
        showError("Please enter your Gmail address.");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError("Please enter a valid email address.");
        return;
      }

      setLoading(true);

      try {
        const response = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ full_name: fullName, email: email }),
        });

        const data = await response.json();

        if (data.error) {
          showError(data.error);
          setLoading(false);
          return;
        }

        localStorage.setItem("cleardoc_user", JSON.stringify(data.user));
        localStorage.setItem("cleardoc_name", fullName);
        localStorage.setItem("cleardoc_email", email);

        btnText.textContent = "✓ " + (data.message || "Success!");
        btnArrow.classList.add("hidden");
        btnSpinner.classList.add("hidden");
        submitBtn.classList.remove("opacity-70", "cursor-not-allowed");
        submitBtn.classList.add("bg-green-500", "text-white");

        setTimeout(() => {
          window.location.href = "/app.html";
        }, 800);
      } catch (err) {
        showError("Network error. Please check your connection and try again.");
        setLoading(false);
      }
    });

    // Check if already signed up
    const existingUser = localStorage.getItem("cleardoc_user");
    if (existingUser) {
      try {
        const user = JSON.parse(existingUser);
        if (user && user.device_id) {
          btnText.textContent = `Welcome back, ${localStorage.getItem("cleardoc_name") || "User"}!`;
          btnArrow.textContent = "arrow_forward";
          submitBtn.classList.add("bg-green-500/20", "border", "border-green-400/50");
        }
      } catch (e) {}
    }
  </script>

</body>
</html>
